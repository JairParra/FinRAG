name: finrag_env
channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python & Data Stack
  - python>=3.14
  - numpy>=2.0.0
  - pandas>=2.2.0

  # Streamlit & Visualization
  - streamlit>=1.35.0
  - plotly>=5.18.0

  # Document Ingestion & Web Parsing
  - pypdf>=4.2.0
  - beautifulsoup4>=4.12.0

  # Environment & Networking
  - python-dotenv>=1.0.1
  - pydantic>=2.7.0
  - requests>=2.31.0
  - pip

  # LangChain & ChromaDB Vector Store
  - pip:
    - openai>=1.35.0
    - langchain>=0.2.10
    - langchain-core>=0.2.20
    - langchain-community>=0.2.10
    - langchain-openai>=0.1.15
    - langchain-chroma>=0.1.2
    - langchainhub>=0.1.20
    - chromadb>=0.5.4
    - tiktoken>=0.7.0
