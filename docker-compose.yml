version: '3.8'

services:
  finreport-rag:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: finreport-rag:latest
    container_name: finreport-rag-app
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      # Persist ChromaDB vector data
      - chroma_data:/app/backend/app/db/chroma_db
      # Persist application logs
      - logs_data:/app/logs
      # Mount sample data (read-only)
      - ./sample_data:/app/sample_data:ro
      # Persist uploaded documents
      - uploads_data:/app/temp_uploads
    env_file:
      - .env
    environment:
      # LangChain Configuration (override .env defaults here if needed)
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      - CHROMA_DB_PATH=${CHROMA_DB_PATH:-backend/app/db/chroma_db}
      # Logging
      - DEBUG_MODE=${DEBUG_MODE:-false}
      - ENABLE_FILE_LOGGING=${ENABLE_FILE_LOGGING:-true}
      # Streamlit
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - finreport-network

networks:
  finreport-network:
    driver: bridge

volumes:
  chroma_data:
    driver: local
  logs_data:
    driver: local
  uploads_data:
    driver: local
